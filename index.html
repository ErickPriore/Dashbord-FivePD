<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Policial - FivePD SP</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="./style.css?v=2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS EMBUTIDO PARA GARANTIR QUE FUNCIONA MESMO COM ERRO DE LINK -->
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #111827;
            padding: 28px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #1f2937;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
            color: #ffffff;
        }

        .close {
            position: absolute;
            right: 20px; top: 16px;
            font-size: 24px;
            color: #9ca3af;
            cursor: pointer;
        }

        .modal h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: #f8fafc;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #9ca3af;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #0b0f19;
            border: 1px solid #1f2937;
            color: #ffffff;
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
        }
    </style>
</head>
