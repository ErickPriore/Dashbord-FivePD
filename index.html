<!-- Modal Novo BO -->
    <div id="modal-bo" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h2>Registrar Novo B.O. (FivePD SP)</h2>
            <form id="form-bo" onsubmit="salvarBO(event)">
                <label for="oficial">Oficial Responsável:</label>
                <input type="text" id="oficial" required placeholder="Ex: Agente Silva">

                <label for="suspeito">Nome do Suspeito / Passaporte:</label>
                <input type="text" id="suspeito" required placeholder="Ex: Nome ou ID do Jogador">

                <label for="infracao">Infração / Motivo:</label>
                <input type="text" id="infracao" required placeholder="Ex: Roubo / Porte de Armas">

                <label for="status">Status Inicial:</label>
                <select id="status" required>
                    <option value="Em Investigação">Em Investigação</option>
                    <option value="Procurado">Procurado</option>
                    <option value="Fechado">Fechado / Preso</option>
                </select>

                <!-- CAMPO DE FOTO ADICIONADO AQUI -->
                <label for="imagem">URL da Imagem / Prova (Opcional):</label>
                <input type="url" id="imagem" placeholder="Ex: https://i.imgur.com/exemplo.png">

                <label for="descricao">Descrição Detalhada:</label>
                <textarea id="descricao" rows="4" placeholder="Adicione relatos, apreensões ou detalhes..."></textarea>

                <button type="submit" class="btn-primary" style="margin-top: 15px; width: 100%;">Registrar B.O.</button>
            </form>
        </div>
    </div>
